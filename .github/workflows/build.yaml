#
# Build the cv
#
name: Build
on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tectonic Cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - name: Install Tectonic runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgraphite2-3

      - name: Setup tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ github.token }}
          tectonic-version: 0.15

      - name: Verify Tectonic
        run: tectonic --version

      - name: Build CV
        run: make

      - name: Prepare PDF files
        run: |
          mkdir public
          mv cn/cv.pdf public/DTian_cv_cn.pdf
          mv en/cv.pdf public/DTian_cv_en.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: ./public

      - name: Upload the two pdf files as release assets
        run: gh release upload ${{ github.ref_name }} ./public/DTian_cv_cn.pdf ./public/DTian_cv_en.pdf
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
